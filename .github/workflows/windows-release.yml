name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install build tools and HexPath
        run: python -m pip install --disable-pip-version-check . pyinstaller==6.16.0

      - name: Run unit tests
        run: python -m unittest discover --start-directory tests --verbose

      - name: Build standalone executable
        run: >-
          python -m PyInstaller
          --clean
          --noconfirm
          --onefile
          --console
          --name hexpath
          --specpath build
          --paths src
          src/hexpath/__main__.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          .\dist\hexpath.exe --version
          .\dist\hexpath.exe --help
          .\dist\hexpath.exe 192.0.2.10 --plan
          .\dist\hexpath.exe assess `
            --scope examples/ipv6-assessment/scope.json `
            --scan examples/ipv6-assessment/scan.json `
            --cves examples/ipv6-assessment/cves.json `
            --target 2001:db8::10

      - name: Package executable and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item dist\hexpath.exe package\hexpath.exe
          Copy-Item WINDOWS.md package\WINDOWS.md
          Compress-Archive -Path package\* -DestinationPath HexPath-Windows-x64.zip
          $hash = (Get-FileHash HexPath-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  HexPath-Windows-x64.zip" | Set-Content -Encoding ascii HexPath-Windows-x64.zip.sha256

      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HexPath-Windows-x64
          path: |
            HexPath-Windows-x64.zip
            HexPath-Windows-x64.zip.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: HexPath-Windows-x64

      - name: Publish tagged GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          HexPath-Windows-x64.zip
          HexPath-Windows-x64.zip.sha256
          --verify-tag
          --generate-notes
          --title "HexPath $env:GITHUB_REF_NAME"
