[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexpath"
version = "0.1.0"
description = "Evidence-aware IPv4 and IPv6 discovery and attack-path analysis"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "HexPath project team" },
]
dependencies = []

[project.scripts]
hexpath = "hexpath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
